<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <h1>Calculator</h1>
  <div class="container">
    <div class="display-panel">
      <div class="display" id="secondary">0</div>
      <div class="display" id="main">0</div>
      
    </div>
    <div class="buttons-panel">
      <div id="zeroth-row" class="rows">
        <button class="btn-others" id="clear">Clear</button>
        <button class="btn-others" id="backspace">Backspace</button>
      </div>
      <div id="first-row" class="rows">
        <button class="btn" id="7" value="7">7</button>
        <button class="btn" id="8" value="8">8</button>
        <button class="btn" id="9" value="9">9</button>
        <button class="btn" id="divide" value="÷">÷</button>
      </div>
      <div id="second-row" class="rows">
        <button class="btn" id="4" value="4">4</button>
        <button class="btn" id="5" value="5">5</button>
        <button class="btn" id="6" value="6">6</button>
        <button class="btn" id="multiply" value="×">×</button>
      </div>
      <div id="third-row" class="rows">
        <button class="btn" id="1" value="1">1</button>
        <button class="btn" id="2" value="2">2</button>
        <button class="btn" id="3" value="3">3</button>
        <button class="btn" id="subtract" value="−">−</button>
      </div>
      <div id="fourth-row" class="rows">
        <button class="btn" id="0" value="0">0</button>
        <button class="btn" value=".">.</button>
        <button class="btn" id="equal" value="=">=</button>
        <button class="btn" id="add" value="+">+</button>
      </div>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
